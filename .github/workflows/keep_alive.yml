name: Manter Apps Acordados
on:
  schedule:
    - cron: '0 */3 * * *' # Executa a cada 3 horas
  workflow_dispatch:      # Permite que você force o teste manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Node.js
        uses: actions/setup-node@v4 
        with:
          node-version: 24

      - name: Instalar Navegador Automatizado
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Simular Acesso Humano nos Apps
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            // Lista com as URLs dos seus dois ambientes
            const urls = [
              'https://viaprev.streamlit.app/',
              'https://viaprev-teste.streamlit.app/',
              'https://calcpei.streamlit.app/',
              'https://promar.streamlit.app/',
              'https://fiscflow.streamlit.app/'
            ];
            
            console.log('Iniciando o navegador...');
            const browser = await chromium.launch({ headless: true });
            
            for (const url of urls) {
              const page = await browser.newPage();
              try {
                console.log('Acessando o app: ' + url);
                await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
                
                console.log('Aguardando 10 segundos para firmar a conexão WebSocket...');
                await new Promise(resolve => setTimeout(resolve, 10000)); 
                console.log('Sucesso para: ' + url);
              } catch (error) {
                console.error('Erro ao acessar ' + url + ':', error.message);
              } finally {
                await page.close();
              }
            }
            
            await browser.close();
            console.log('Todos os apps foram atualizados com sucesso!');
          })();
          "
